<!DOCTYPE html>
<html class="staticrypt-html" lang="vi">
    <head>
        <meta charset="utf-8" />
        <title>H4cknet</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
                width: 100%; height: 100%;
                overflow: hidden;
                background-color: #000;
                font-family: "Segoe UI", system-ui, sans-serif;
            }

            body.staticrypt-body {
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            /* ---- BACKGROUND BLUR + BLOB XANH ---- */
            .blur-background {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 0;
                pointer-events: none;
                filter: blur(100px);
                mix-blend-mode: screen;
                transition: opacity 0.4s ease;
            }
            .blur-background.dynamic-color {
                animation: colorShift 20s infinite alternate ease-in-out;
            }
            @keyframes colorShift {
                0% { filter: blur(100px) hue-rotate(0deg); }
                50% { filter: blur(110px) hue-rotate(35deg); }
                100% { filter: blur(90px) hue-rotate(-25deg); }
            }
            .blob {
                position: absolute;
                border-radius: 50%;
                will-change: transform, opacity;
                animation: floatBlob 20s infinite alternate ease-in-out;
            }
            .blob--navy { background: #0f1a3a; width: 50vw; height: 50vw; min-width: 300px; min-height: 300px; top: -10%; left: -5%; opacity: 0.7; animation-duration: 24s; }
            .blob--blue { background: #1a4a8a; width: 65vw; height: 65vw; min-width: 400px; min-height: 400px; bottom: -20%; right: -10%; opacity: 0.6; animation-duration: 28s; animation-delay: -5s; }
            .blob--navy2 { background: #0f1a3a; width: 45vw; height: 45vw; min-width: 250px; min-height: 250px; top: 40%; left: 40%; opacity: 0.45; animation-duration: 32s; animation-delay: -12s; }
            @keyframes floatBlob {
                0% { transform: translate(0, 0) scale(1) rotate(0deg); }
                25% { transform: translate(40px, -30px) scale(1.1) rotate(10deg); }
                50% { transform: translate(-30px, 50px) scale(0.9) rotate(-5deg); }
                75% { transform: translate(20px, 20px) scale(1.05) rotate(5deg); }
                100% { transform: translate(-20px, -40px) scale(1) rotate(-2deg); }
            }

            #particle-canvas {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 2;
                pointer-events: none;
                display: block;
            }

            /* ============ OVERLAY INTRO ============ */
            .overlay {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(ellipse at 50% 40%, #14142b, #06060c 70%);
                color: #fff;
                overflow: hidden;
                opacity: 1;
                visibility: visible;
                transition: opacity 0.8s ease, visibility 0.8s;
                transform: translateZ(0);
                will-change: opacity;
                cursor: pointer;
            }
            .overlay.hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
            .overlay::before {
                content: "";
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(2px 2px at 12% 22%, #b4a0ff, transparent 60%),
                    radial-gradient(2px 2px at 78% 18%, #96b4ff, transparent 60%),
                    radial-gradient(2px 2px at 32% 78%, #c8aaff, transparent 60%),
                    radial-gradient(2px 2px at 88% 82%, #a0c8ff, transparent 60%),
                    radial-gradient(2px 2px at 55% 45%, #d0b8ff, transparent 60%),
                    radial-gradient(2px 2px at 22% 55%, #a8c0ff, transparent 60%);
                pointer-events: none;
            }
            .overlay .content {
                position: relative;
                z-index: 10;
                text-align: center;
                padding: 2rem;
            }
            .logo-wrap {
                position: relative;
                display: inline-block;
                padding: 0.4rem 1.2rem;
                overflow: hidden;
                transform: translateZ(0);
            }
            .light-sweep {
                position: absolute;
                top: 0; left: 0;
                width: 60%; height: 100%;
                background: linear-gradient(100deg, transparent, rgba(255,255,255,0.85) 50%, transparent);
                opacity: 0;
                transform: translateX(-180%) skewX(-12deg);
                will-change: transform, opacity;
                pointer-events: none;
            }
            .light-sweep.active {
                animation: sweep 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            }
            @keyframes sweep {
                0% { transform: translateX(-180%) skewX(-12deg); opacity: 0; }
                15% { opacity: 1; }
                85% { opacity: 1; }
                100% { transform: translateX(280%) skewX(-12deg); opacity: 0; }
            }
            .greeting {
                font-size: clamp(3rem, 10vw, 6rem);
                font-weight: 900;
                letter-spacing: -0.03em;
                background: linear-gradient(135deg, #fff, #d4caff, #90b0ff, #fff);
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                transform: translateZ(0);
            }
            .start-btn {
                position: relative;
                margin-top: 2.4rem;
                padding: 1rem 3rem;
                font-size: 0.95rem;
                font-weight: 700;
                letter-spacing: 0.28em;
                text-transform: uppercase;
                color: #fff;
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(160,140,255,0.5);
                border-radius: 60px;
                cursor: pointer;
                overflow: hidden;
                z-index: 30;
                transform: translateZ(0);
                transition: transform 0.3s ease, background 0.3s ease;
                -webkit-tap-highlight-color: transparent;
                appearance: none;
                -webkit-appearance: none;
                outline: none;
                user-select: none;
            }
            .start-btn::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 60px;
                padding: 1px;
                background: linear-gradient(120deg, transparent 30%, rgba(220,200,255,1) 50%, transparent 70%);
                background-size: 250% 100%;
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor;
                mask-composite: exclude;
                animation: borderSweep 3.5s linear infinite;
                pointer-events: none;
            }
            @keyframes borderSweep {
                0% { background-position: 200% 0; }
                100% { background-position: -200% 0; }
            }
            .start-btn:hover {
                background: rgba(140,120,255,0.15);
                transform: translateZ(0) translateY(-3px) scale(1.03);
            }
            .start-btn:active {
                transform: translateZ(0) translateY(-1px) scale(0.99);
            }

            /* ============ FORM ĐĂNG NHẬP ============ */
            .staticrypt-page {
                position: relative;
                z-index: 10;
                width: 360px;
                max-width: 92vw;
                padding: 0;
                margin: auto;
                box-sizing: border-box;
            }
            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: rgba(15, 26, 58, 0.55);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border: 1px solid rgba(120, 170, 230, 0.25);
                border-radius: 18px;
                max-width: 360px;
                margin: 0 auto;
                padding: 40px 35px 35px;
                text-align: center;
                box-shadow: 0 0 40px 0 rgba(20, 60, 140, 0.45), 0 8px 30px 0 rgba(0, 0, 0, 0.5);
                color: #ffffff;
            }
            .staticrypt-hr {
                margin-top: 18px;
                margin-bottom: 22px;
                border: 0;
                border-top: 1px solid rgba(120, 170, 230, 0.25);
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                outline: 0;
                padding: 15px 40px 15px 15px;
                width: 100%;
                color: #ffffff;
                letter-spacing: 0.5px;
            }
            .staticrypt-form input::placeholder {
                color: rgba(190, 215, 245, 0.6);
            }
            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(120, 170, 230, 0.25);
                border-radius: 10px;
                width: 100%;
                margin: 0 0 18px;
                box-sizing: border-box;
                transition: border-color 0.25s ease, background 0.25s ease;
            }
            .staticrypt-password-container:focus-within {
                border-color: rgba(120, 190, 255, 0.8);
                background: rgba(255, 255, 255, 0.1);
                box-shadow: 0 0 0 3px rgba(60, 140, 240, 0.2);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.65;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1) brightness(1.4);
                transition: opacity 0.2s ease;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 1; }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 1.5px;
                outline: 0;
                background: linear-gradient(135deg, #2a6ba8, #1a4a8a);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: filter 0.25s ease, transform 0.1s ease, box-shadow 0.25s ease;
                box-shadow: 0 4px 18px rgba(40, 110, 200, 0.4);
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(1.15);
                box-shadow: 0 6px 24px rgba(60, 140, 240, 0.55);
            }
            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(1px);
                filter: brightness(0.95);
            }
            .staticrypt-instructions {
                margin-top: -0.4em;
                margin-bottom: 1em;
            }
            .staticrypt-title {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.03em;
                font-size: 1.5em;
                color: #ffffff;
                font-weight: 700;
                letter-spacing: 0.5px;
                margin-bottom: 0.4em;
                perspective: 800px;
            }
            .staticrypt-title span {
                display: inline-block;
                opacity: 0;
                transform-origin: center bottom;
                animation: titleAppear 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.4) forwards;
                animation-delay: calc(var(--i) * 0.08s + 0.1s);
            }
            @keyframes titleAppear {
                0% { opacity: 0; transform: scale(2.2) skewX(35deg) translateY(-10px); filter: blur(12px); }
                60% { opacity: 1; filter: blur(2px); }
                100% { opacity: 1; transform: scale(1) skewX(0) translateY(0); filter: blur(0); }
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                color: rgba(190, 215, 245, 0.8);
                font-size: 0.95em;
                margin-top: 0.4em;
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1.2em;
                color: rgba(190, 215, 245, 0.85);
                font-size: 0.9em;
                cursor: pointer;
                user-select: none;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.4);
                margin-right: 1em;
                cursor: pointer;
                accent-color: #2a6ba8;
            }
            .hidden { display: none !important; }

            /* Nút tắt/bật nhạc */
            .music-toggle {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 100;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: rgba(15, 26, 58, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(120, 170, 230, 0.4);
                color: #fff;
                font-size: 20px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.2s ease, background 0.2s ease;
                -webkit-tap-highlight-color: transparent;
                outline: none;
                opacity: 0;
                pointer-events: none;
            }
            .music-toggle.visible {
                opacity: 1;
                pointer-events: auto;
            }
            .music-toggle:hover {
                background: rgba(40, 80, 160, 0.85);
                transform: scale(1.1);
            }
            .music-toggle:active {
                transform: scale(0.95);
            }

            /* ============ SPINNER LOADING ============ */
            .staticrypt-spinner-container {
                height: 100vh;
                width: 100vw;
                display: flex;
                align-items: center;
                justify-content: center;
                position: fixed;
                top: 0; left: 0;
                z-index: 20;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2.5rem;
                height: 2.5rem;
                vertical-align: text-bottom;
                border: 0.25em solid rgba(120, 170, 230, 0.4);
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>

        <!-- Script Overlay + Nhạc -->
        <script>
            (function () {
                const overlay = document.getElementById("intro-overlay");
                const btn = document.getElementById("start-btn");
                const sweep = document.getElementById("light-sweep");
                const bgMusic = document.getElementById("bgMusic");
                const musicToggle = document.getElementById("musicToggle");
                let done = false;
                let musicPlaying = false;

                if (!overlay || !btn || !sweep) return;

                function enterSite() {
                    if (done) return;
                    done = true;
                    btn.disabled = true;

                    // Phát nhạc (trong sự kiện click thật → được phép)
                    bgMusic.volume = 0.4;
                    bgMusic.play()
                        .then(() => {
                            musicPlaying = true;
                            musicToggle.textContent = "🔊";
                        })
                        .catch((err) => {
                            console.warn("Không phát được nhạc:", err);
                            musicToggle.textContent = "🔇";
                        });

                    // Hiện nút tắt/bật nhạc
                    setTimeout(() => musicToggle.classList.add("visible"), 1000);

                    // Vệt sáng + ẩn overlay
                    sweep.classList.add("active");
                    setTimeout(() => overlay.classList.add("hidden"), 600);
                    setTimeout(() => overlay.remove(), 1500);
                }

                btn.addEventListener("click", enterSite);
                overlay.addEventListener("click", enterSite);

                // Nút tắt/bật nhạc
                musicToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    if (musicPlaying) {
                        bgMusic.pause();
                        musicPlaying = false;
                        musicToggle.textContent = "🔇";
                    } else {
                        bgMusic.play()
                            .then(() => {
                                musicPlaying = true;
                                musicToggle.textContent = "🔊";
                            })
                            .catch(() => {
                                musicToggle.textContent = "🔇";
                            });
                    }
                });
            })();
        </script>

        <!-- Script hiệu ứng nền particle -->
        <script>
            (function () {
                const canvas = document.getElementById("particle-canvas");
                const ctx = canvas.getContext("2d");

                let width = window.innerWidth;
                let height = window.innerHeight;
                let particles = [];

                const baseParticleCount = () => {
                    const area = width * height;
                    return Math.min(120, Math.max(50, Math.floor(area / 14000)));
                };

                const blueTones = [
                    "#4a8ec2", "#2a6ba8", "#7ab8e0", "#1a4a8a", "#5aa0d8",
                    "#3f7eb6", "#9fd0f0", "#0f3a6e", "#6bb0e8", "#2c5f9a",
                ];

                function createParticle(randomY = false) {
                    const x = Math.random() * width;
                    const y = randomY ? Math.random() * height : Math.random() < 0.3 ? -10 : height + 10;
                    const baseSize = Math.random() * 3.2 + 0.8;
                    const isLarge = baseSize > 2.8;
                    return {
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() * 0.8 + 0.2) * (Math.random() < 0.5 ? -1 : 1),
                        size: baseSize, baseSize: baseSize,
                        pulsePhase: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.02 + Math.random() * 0.05,
                        color: blueTones[Math.floor(Math.random() * blueTones.length)],
                        glow: isLarge,
                        alpha: 0.6 + Math.random() * 0.4,
                    };
                }

                function resizeCanvas() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height;
                    const targetCount = baseParticleCount();
                    if (particles.length < targetCount) {
                        for (let i = particles.length; i < targetCount; i++) particles.push(createParticle(true));
                    } else if (particles.length > targetCount) {
                        particles = particles.slice(0, targetCount);
                    }
                }

                function drawConnections(list, maxDistance = 120) {
                    for (let i = 0; i < list.length; i++) {
                        const p1 = list[i];
                        for (let j = i + 1; j < list.length; j++) {
                            const p2 = list[j];
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const distSq = dx * dx + dy * dy;
                            if (distSq < maxDistance * maxDistance) {
                                const dist = Math.sqrt(distSq);
                                const opacity = 0.18 * (1 - dist / maxDistance);
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(80, 150, 220, ${opacity})`;
                                ctx.lineWidth = 0.7;
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    }
                }

                function drawParticles(timestamp) {
                    ctx.clearRect(0, 0, width, height);
                    drawConnections(particles, 120);
                    for (let p of particles) {
                        const pulseFactor = 0.8 + 0.4 * Math.sin(p.pulsePhase + timestamp * 0.001 * p.pulseSpeed);
                        const drawSize = p.baseSize * pulseFactor;
                        p.pulsePhase += 0.03;
                        if (p.glow) {
                            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, drawSize * 4);
                            gradient.addColorStop(0, p.color + "aa");
                            gradient.addColorStop(0.6, p.color + "55");
                            gradient.addColorStop(1, p.color + "00");
                            ctx.beginPath();
                            ctx.fillStyle = gradient;
                            ctx.arc(p.x, p.y, drawSize * 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.beginPath();
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.alpha * (0.9 + 0.2 * Math.sin(p.pulsePhase));
                        ctx.arc(p.x, p.y, drawSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }

                function updateParticles() {
                    for (let p of particles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < -20) p.x = width + 15;
                        else if (p.x > width + 20) p.x = -15;
                        if (p.y < -20) p.y = height + 15;
                        else if (p.y > height + 20) p.y = -15;
                    }
                }

                function animate(timestamp) {
                    updateParticles();
                    drawParticles(timestamp);
                    requestAnimationFrame(animate);
                }

                window.addEventListener("resize", resizeCanvas);
                resizeCanvas();
                requestAnimationFrame(animate);
            })();
        </script>
    </body>
